# Managed by ocm-main (overlay/). Edits on maintenance branches are overwritten by Sync upstream.
name: OCM CI

on:
  # Renovate branch automerge waits for these checks before fast-forwarding.
  push:
    branches: ['renovate/**']
  # Renovate falls back to a PR when checks fail.
  pull_request:
    branches: ['ocm/v*']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOFIPS140: certified
  GOTOOLCHAIN: local

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load .github/ocm/.env
        run: |
          for k in GO_VERSION FIPS_SKIP_TESTS; do
            echo "${k}=$(grep -E "^${k}=" .github/ocm/.env | cut -d= -f2-)" >> "$GITHUB_ENV"
          done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Run unit tests
        run: |
          # shellcheck disable=SC2046
          CGO_ENABLED=0 go test ${FIPS_SKIP_TESTS:+-skip "$FIPS_SKIP_TESTS"} $(go list ./... | grep -v third_party/)

  race:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load .github/ocm/.env
        run: |
          for k in GO_VERSION FIPS_SKIP_TESTS; do
            echo "${k}=$(grep -E "^${k}=" .github/ocm/.env | cut -d= -f2-)" >> "$GITHUB_ENV"
          done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Run unit tests with -race
        run: |
          # shellcheck disable=SC2046
          CGO_ENABLED=1 go test -race ${FIPS_SKIP_TESTS:+-skip "$FIPS_SKIP_TESTS"} $(go list ./... | grep -v third_party/)

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker image prune -af
          df -h
      - name: Load .github/ocm/.env
        run: |
          for k in GO_VERSION KIND_VERSION; do
            echo "${k}=$(grep -E "^${k}=" .github/ocm/.env | cut -d= -f2-)" >> "$GITHUB_ENV"
          done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
      - name: Set up kind cluster
        run: |
          # Used to test: cosign generate-key-pair k8s://...
          go install "sigs.k8s.io/kind@${KIND_VERSION}"
          kind create cluster
      - name: Run end-to-end tests
        run: CGO_ENABLED=1 ./test/e2e_test.sh

  e2e-cross:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load .github/ocm/.env
        run: echo "GO_VERSION=$(grep -E '^GO_VERSION=' .github/ocm/.env | cut -d= -f2-)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Run cross platform e2e tests
        run: go test -tags=e2e,cross -v ./test/...

  fips-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load .github/ocm/.env
        run: echo "GO_VERSION=$(grep -E '^GO_VERSION=' .github/ocm/.env | cut -d= -f2-)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      - name: Build and verify FIPS binary
        env:
          # Go stamps the main module version from VCS, and release-utils prefers
          # it over the gitVersion ldflag; without VCS stamping GIT_VERSION wins.
          GOFLAGS: -buildvcs=false
        run: |
          make cosign GIT_VERSION="ci-${GITHUB_SHA::12}"
          .github/ocm/verify-fips.sh cosign
          ./cosign version
