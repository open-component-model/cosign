# One dependency-update PR: hack/bump.sh open -> wait for its CI -> fast-forward the target.
# Called by Maintain for every target/group; dispatch it to run a single update:
#   gh workflow run bump.yml --ref main -f target=ocm/v3.1.3 -f slug=go-modules
name: Bump

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      slug:
        type: string
        required: true
      rebuilt:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      target:
        description: 'Branch to update: main or ocm/vX.Y.Z'
        type: string
        required: true
      slug:
        description: 'go-modules (ocm/vX.Y.Z), or go-toolchain | test-tooling | sigstore-e2e-services | github-actions | base-images (main)'
        type: string
        required: true
      rebuilt:
        description: 'Set by Bump itself when it rebuilds an update whose target moved during CI (rebuilds once)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bump:
    name: ${{ inputs.target }} ${{ inputs.slug }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    environment:
      name: automation
      deployment: false
    permissions:
      contents: read
      # wait: read the PR's CI run and re-run its failed jobs with GITHUB_TOKEN, which,
      # unlike the 1h app token, lasts as long as the job.
      actions: write
    steps:
      # Pushes need the ocmbot token: GITHUB_TOKEN may not touch .github/workflows and only
      # ocmbot may push to main and ocm/v* (rulesets).
      - id: open-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.OCMBOT_APP_ID }}
          private-key: ${{ secrets.OCMBOT_PRIV_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write
          permission-pull-requests: write
          # Labels are an issues API.
          permission-issues: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false
      - name: Load .github/ocm/.env
        run: echo "GO_VERSION=$(grep -E '^GO_VERSION=' control/overlay/.github/ocm/.env | cut -d= -f2-)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - id: open
        name: Update and open PR
        env:
          GH_APP_TOKEN: ${{ steps.open-token.outputs.token }}
          GH_TOKEN: ${{ steps.open-token.outputs.token }}
          GOTOOLCHAIN: local
        run: control/hack/bump.sh open "${{ inputs.target }}" "${{ inputs.slug }}"
      - id: wait
        if: steps.open.outputs.state == 'open'
        name: Wait for CI
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.open.outputs.target }}
          SHA: ${{ steps.open.outputs.sha }}
        run: control/hack/bump.sh wait
      # Minted after the wait: CI can outlast the first token.
      - id: merge-token
        if: steps.wait.outputs.result == 'success'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.OCMBOT_APP_ID }}
          private-key: ${{ secrets.OCMBOT_PRIV_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write
          permission-pull-requests: read
      - name: Merge
        if: steps.wait.outputs.result == 'success'
        env:
          GH_APP_TOKEN: ${{ steps.merge-token.outputs.token }}
          GH_TOKEN: ${{ steps.merge-token.outputs.token }}
          TARGET: ${{ steps.open.outputs.target }}
          BRANCH: ${{ steps.open.outputs.branch }}
          SHA: ${{ steps.open.outputs.sha }}
          PR: ${{ steps.open.outputs.pr }}
          REBUILT: ${{ inputs.rebuilt }}
          # workflow_dispatch is one of the few events GITHUB_TOKEN may trigger; the job has actions: write.
          DISPATCH_TOKEN: ${{ github.token }}
        run: control/hack/bump.sh merge
