name: Sync upstream

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [ocm-main]
    paths:
      - 'overlay/**'
      - 'hack/**'
      - '.github/workflows/sync-upstream.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream stable tag to create a maintenance branch for (bypasses MIN_TAG)'
        type: string
        required: false

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-slim
    environment:
      name: automation
      deployment: false
    steps:
      # GITHUB_TOKEN may not touch .github/workflows and only ocmbot may push to ocm/v* (maintenance-branches ruleset), so the ocmbot app token is mandatory.
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.OCMBOT_APP_ID }}
          private-key: ${{ secrets.OCMBOT_PRIV_KEY }}
          repositories: cosign
          permission-contents: write
          permission-workflows: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false
      - name: Sync tags, branches and overlay
        env:
          GH_APP_TOKEN: ${{ steps.token.outputs.token }}
          MIN_TAG: v3.1.3
          EXTRA_TAG: ${{ inputs.tag }}
          CONTROL_DIR: ${{ github.workspace }}/control
          CONTROL_SHA: ${{ github.sha }}
        run: control/hack/sync-upstream.sh
