name: Sync upstream

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'overlay/**'
      - 'hack/**'
      - '.github/workflows/sync-upstream.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream stable tag to create a maintenance branch for (bypasses MIN_TAG)'
        type: string
        required: false

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-slim
    # COSIGN_BOT_* are environment secrets; the environment admits only main and ocm/v*.
    environment:
      name: release-automation
      deployment: false
    steps:
      # ocm-bot-release-cosign (installed on cosign only) mirrors the tags and writes ocm/v*.
      # The overlay contains workflows, which GITHUB_TOKEN may not write.
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.COSIGN_BOT_CLIENT_ID }}
          private-key: ${{ secrets.COSIGN_BOT_PRIVATE_KEY }}
          repositories: cosign
          permission-contents: write # mirror tags, create blobs/trees/commits, move ocm/v*
          permission-workflows: write # the overlay replaces .github/workflows on ocm/v*
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: control
          persist-credentials: false
      - name: Sync tags, branches and overlay
        env:
          GH_APP_TOKEN: ${{ steps.token.outputs.token }}
          BOT_SLUG: ${{ steps.token.outputs.app-slug }}
          MIN_TAG: v3.1.3
          EXTRA_TAG: ${{ inputs.tag }}
          CONTROL_DIR: ${{ github.workspace }}/control
          CONTROL_SHA: ${{ github.sha }}
        run: control/hack/sync-upstream.sh
