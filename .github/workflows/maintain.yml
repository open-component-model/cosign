# Daily dependency updates, each one a PR labelled `dependencies` that ocmbot fast-forwards
# into its target once CI passes (Bump, hack/bump.sh). A red run means at least one update
# PR failed CI and stays open. docs/maintenance.md describes groups and lifecycle.
name: Maintain

on:
  schedule:
    - cron: '0 2 * * *' # before Release schedule (06:00) releases what merged
  workflow_dispatch:
    inputs:
      weekly:
        description: 'Also run the weekly ocm-main groups'
        type: boolean
        default: false

concurrency:
  group: maintain
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-slim
    outputs:
      branches: ${{ steps.plan.outputs.branches }}
      groups: ${{ steps.plan.outputs.groups }}
    steps:
      - id: plan
        env:
          WEEKLY: ${{ inputs.weekly || false }}
        run: |
          set -euo pipefail
          branches="$(git ls-remote --heads "https://github.com/${GITHUB_REPOSITORY}" 'refs/heads/ocm/v*' \
            | sed 's#.*refs/heads/##' | sort -V | jq -Rnc '[inputs]')"
          # The Go toolchain daily (stdlib security fixes), everything else on Sundays.
          list=(go-toolchain)
          if [ "$(date -u +%u)" = 7 ] || [ "$WEEKLY" = true ]; then
            list+=(test-tooling sigstore-e2e-services github-actions base-images)
          fi
          groups="$(printf '%s\n' "${list[@]}" | jq -Rnc '[inputs]')"
          echo "branches=${branches}" >> "$GITHUB_OUTPUT"
          echo "groups=${groups}" >> "$GITHUB_OUTPUT"
          {
            echo "| update | targets |"
            echo "| --- | --- |"
            echo "| go-modules | ${branches} |"
            echo "| ocm-main pins | ${groups} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Maintenance branches are independent: in parallel.
  go-modules:
    needs: plan
    if: needs.plan.outputs.branches != '[]'
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.branches) }}
    uses: ./.github/workflows/bump.yml
    with:
      target: ${{ matrix.target }}
      slug: go-modules
    secrets: inherit

  # All groups update ocm-main: one at a time, each on top of the previous merge.
  pins:
    needs: plan
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        slug: ${{ fromJSON(needs.plan.outputs.groups) }}
    uses: ./.github/workflows/bump.yml
    with:
      target: ocm-main
      slug: ${{ matrix.slug }}
    secrets: inherit
