# Managed by ocm-main (overlay/). Edits on maintenance branches are overwritten by Sync upstream.
name: OCM CI

on:
  # Maintain's update PRs (hack/bump.sh on ocm-main): it fast-forwards the branch once these pass.
  pull_request:
    branches: ['ocm/v*']
  workflow_call:
    inputs:
      version:
        description: Version stamped into the binaries (default ci-<sha>)
        type: string
        required: false
    outputs:
      fips-module:
        description: CMVP-certified Go Cryptographic Module the binaries were built with
        value: ${{ jobs.build.outputs.fips-module }}
  workflow_dispatch:

permissions:
  contents: read

env:
  GOFIPS140: certified
  GOTOOLCHAIN: local

# Each job keeps its own Go build cache: a shared key is saved by whichever job finishes
# first, so jobs with other build flags (-race, e2e tags, cross builds) would always start cold.
jobs:
  # Unit tests run once, with -race (CGO needed for the race detector), on arm64; amd64
  # code paths execute in e2e. The cross-platform e2e tests need no services and share
  # this job's setup.
  race:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load .github/ocm/.env
        run: |
          {
            echo "GO_VERSION=$(grep -E '^GO_VERSION=' .github/ocm/.env | cut -d= -f2-)"
            echo "FIPS_SKIP_TESTS=$(grep -E '^FIPS_SKIP_TESTS=' .github/ocm/.env | cut -d= -f2-)"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-
      - name: Run unit tests with -race
        run: |
          # shellcheck disable=SC2046
          CGO_ENABLED=1 go test -race ${FIPS_SKIP_TESTS:+-skip "$FIPS_SKIP_TESTS"} $(go list ./... | grep -v third_party/)
      - name: Run cross platform e2e tests
        run: go test -tags=e2e,cross -v ./test/...
      # Only maintenance branches save: PR caches are scoped to the PR and die with it.
      - if: success() && startsWith(github.ref, 'refs/heads/ocm/') && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # amd64 runner: rekor's MySQL image (gcr.io/trillian-opensource-ci/db_server) is amd64-only,
  # and the service image cache seeded by Control CI is amd64.
  e2e:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load .github/ocm/.env
        run: |
          {
            echo "GO_VERSION=$(grep -E '^GO_VERSION=' .github/ocm/.env | cut -d= -f2-)"
            echo "CLONE_DIR=${RUNNER_TEMP}/sigstore-services"
            echo "IMAGES_KEY=$(.github/ocm/e2e.sh key)"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-
      # Seeded by Control CI on ocm-main, the only scope every branch can read.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sigstore-images.tar
          key: ${{ env.IMAGES_KEY }}
      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
      - name: Run end-to-end tests
        run: .github/ocm/e2e.sh run "${RUNNER_TEMP}/sigstore-images.tar"
      # Only maintenance branches save: PR caches are scoped to the PR and die with it.
      - if: success() && startsWith(github.ref, 'refs/heads/ocm/') && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # All release binaries, cross-compiled once on one runner; OCM Release publishes this
  # artifact instead of rebuilding.
  build:
    runs-on: ubuntu-26.04-arm
    outputs:
      fips-module: ${{ steps.build.outputs.fips-module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load .github/ocm/.env
        run: |
          {
            echo "GO_VERSION=$(grep -E '^GO_VERSION=' .github/ocm/.env | cut -d= -f2-)"
            echo "GOVULNCHECK_VERSION=$(grep -E '^GOVULNCHECK_VERSION=' .github/ocm/.env | cut -d= -f2-)"
            echo "CYCLONEDX_GOMOD_VERSION=$(grep -E '^CYCLONEDX_GOMOD_VERSION=' .github/ocm/.env | cut -d= -f2-)"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-
      - id: build
        name: Cross-compile and verify FIPS binaries
        env:
          VERSION: ${{ inputs.version || format('ci-{0}', github.sha) }}
          # Go stamps the main module version from VCS, and release-utils prefers
          # it over the gitVersion ldflag; without VCS stamping GIT_VERSION wins.
          GOFLAGS: -buildvcs=false
        run: |
          set -euo pipefail
          mkdir -p dist
          # Upstream's binary set (.goreleaser.yml), minus the CGO pivkey-pkcs11key variants.
          for target in linux/amd64 linux/arm64 linux/arm linux/ppc64le linux/s390x linux/riscv64 \
            darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}" arch="${target#*/}"
            out="dist/cosign-${os}-${arch}"
            if [ "$os" = windows ]; then out+=".exe"; fi
            # The Makefile forces CGO_ENABLED=0 and -trimpath; names match upstream assets.
            # GOARM=7 as upstream (image platform linux/arm/v7); ignored for other arches.
            GOOS="$os" GOARCH="$arch" GOARM=7 make cosign GIT_VERSION="$VERSION"
            mv cosign "$out"
            .github/ocm/verify-fips.sh "$out"
          done
          echo "fips-module=$(cat "$(go env GOROOT)/lib/fips140/certified.txt")" >> "$GITHUB_OUTPUT"
      - name: Run native binary
        run: dist/cosign-linux-arm64 version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: dist/
          if-no-files-found: error
      # Per release target, from source with the build env of `make cosign` (CGO_ENABLED=0,
      # no tags, job-level GOFIPS140), into reports/:
      # - cosign-<os>-<arch>.openvex.json: govulncheck (source mode), scoped to that binary
      #   (vex-scope.sh: product pkg:golang/<module> plus the binary's SHA-256);
      # - cosign-<os>-<arch>.cdx.json: CycloneDX SBOM (cyclonedx-gomod, main module version set
      #   to the release version, which has no git tag yet);
      # - govulncheck.openvex.json: all targets merged (affected if any target reaches it),
      #   scoped to the module.
      # OCM Release attests them on the binaries and the image. Findings never fail the build
      # (docs/verification.md).
      - name: Vulnerability reports (OpenVEX) and SBOMs
        env:
          VERSION: ${{ inputs.version || format('ci-{0}', github.sha) }}
        run: |
          set -euo pipefail
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          go install "github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@${CYCLONEDX_GOMOD_VERSION}"
          bin="$(go env GOPATH)/bin"
          module="$(go list -m)"
          mkdir -p reports raw
          # Keep in sync with the targets of "Cross-compile and verify FIPS binaries" and the
          # targets matrix of ocm-release.yml.
          for target in linux/amd64 linux/arm64 linux/arm linux/ppc64le linux/s390x linux/riscv64 \
            darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}" arch="${target#*/}"
            name="cosign-${os}-${arch}"
            binary="dist/${name}"
            if [ "$os" = windows ]; then binary+=".exe"; fi
            export CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" GOARM=7
            "${bin}/govulncheck" -format openvex ./cmd/cosign > "raw/${name}.openvex.json"
            "${bin}/cyclonedx-gomod" app -json -std -licenses -main cmd/cosign -output "raw/${name}.cdx.json" .
            unset CGO_ENABLED GOOS GOARCH GOARM
            .github/ocm/vex-scope.sh "raw/${name}.openvex.json" "pkg:golang/${module}" "$binary" > "reports/${name}.openvex.json"
            jq --arg v "$VERSION" --arg purlv "$(jq -rn --arg v "$VERSION" '$v | @uri')" '
              .metadata.component.version = $v
              | .metadata.component.purl |= sub("@[^?#]*"; "@" + $purlv)
            ' "raw/${name}.cdx.json" > "reports/${name}.cdx.json"
          done
          .github/ocm/vex-merge.sh raw/cosign-*.openvex.json > raw/govulncheck.openvex.json
          .github/ocm/vex-scope.sh raw/govulncheck.openvex.json "pkg:golang/${module}" > reports/govulncheck.openvex.json
          .github/ocm/vex-summary.sh reports/cosign-*.openvex.json >> "$GITHUB_STEP_SUMMARY"
          affected="$(jq '[.statements[]? | select(.status == "affected")] | length' reports/govulncheck.openvex.json)"
          if [ "$affected" -gt 0 ]; then
            echo "::warning title=govulncheck::${affected} known vulnerabilities affect cosign, see the job summary"
          fi
      # Kept out of dist/: dist/ is the image build context and the set of release binaries.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: reports/*.json
          if-no-files-found: error
      # Only maintenance branches save: PR caches are scoped to the PR and die with it.
      - if: success() && startsWith(github.ref, 'refs/heads/ocm/') && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
