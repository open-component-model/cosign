# Managed by ocm-main (overlay/). Edits on maintenance branches are overwritten by Sync upstream.
name: OCM CI

on:
  # Renovate branch automerge waits for these checks before fast-forwarding.
  push:
    branches: ['renovate/**']
  # Renovate falls back to a PR when checks fail.
  pull_request:
    branches: ['ocm/v*']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOFIPS140: certified
  GOTOOLCHAIN: local

# Each job keeps its own Go build cache: a shared key is saved by whichever job finishes
# first, so jobs with other build flags (-race, e2e tags, cross builds) would always start cold.
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load .github/ocm/.env
        run: |
          for k in GO_VERSION FIPS_SKIP_TESTS; do
            echo "${k}=$(grep -E "^${k}=" .github/ocm/.env | cut -d= -f2-)" >> "$GITHUB_ENV"
          done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-
      - name: Run unit tests
        run: |
          # shellcheck disable=SC2046
          CGO_ENABLED=0 go test ${FIPS_SKIP_TESTS:+-skip "$FIPS_SKIP_TESTS"} $(go list ./... | grep -v third_party/)
      # Only maintenance branches save: renovate/** caches are branch-scoped and die with the branch.
      - if: success() && startsWith(github.ref, 'refs/heads/ocm/') && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  race:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load .github/ocm/.env
        run: |
          for k in GO_VERSION FIPS_SKIP_TESTS; do
            echo "${k}=$(grep -E "^${k}=" .github/ocm/.env | cut -d= -f2-)" >> "$GITHUB_ENV"
          done
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-
      - name: Run unit tests with -race
        run: |
          # shellcheck disable=SC2046
          CGO_ENABLED=1 go test -race ${FIPS_SKIP_TESTS:+-skip "$FIPS_SKIP_TESTS"} $(go list ./... | grep -v third_party/)
      # Only maintenance branches save: renovate/** caches are branch-scoped and die with the branch.
      - if: success() && startsWith(github.ref, 'refs/heads/ocm/') && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load .github/ocm/.env
        run: |
          {
            echo "GO_VERSION=$(grep -E '^GO_VERSION=' .github/ocm/.env | cut -d= -f2-)"
            echo "CLONE_DIR=${RUNNER_TEMP}/sigstore-services"
            echo "IMAGES_KEY=$(.github/ocm/e2e.sh key)"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-
      # Seeded by Control CI on ocm-main, the only scope every branch can read.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sigstore-images.tar
          key: ${{ env.IMAGES_KEY }}
      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
      - name: Run end-to-end tests
        run: .github/ocm/e2e.sh run "${RUNNER_TEMP}/sigstore-images.tar"
      # Only maintenance branches save: renovate/** caches are branch-scoped and die with the branch.
      - if: success() && startsWith(github.ref, 'refs/heads/ocm/') && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  e2e-cross:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load .github/ocm/.env
        run: echo "GO_VERSION=$(grep -E '^GO_VERSION=' .github/ocm/.env | cut -d= -f2-)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-
      - name: Run cross platform e2e tests
        run: go test -tags=e2e,cross -v ./test/...
      # Only maintenance branches save: renovate/** caches are branch-scoped and die with the branch.
      - if: success() && startsWith(github.ref, 'refs/heads/ocm/') && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  fips-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load .github/ocm/.env
        run: echo "GO_VERSION=$(grep -E '^GO_VERSION=' .github/ocm/.env | cut -d= -f2-)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ env.GO_VERSION }}-
      - name: Build and verify FIPS binary
        env:
          # Go stamps the main module version from VCS, and release-utils prefers
          # it over the gitVersion ldflag; without VCS stamping GIT_VERSION wins.
          GOFLAGS: -buildvcs=false
        run: |
          make cosign GIT_VERSION="ci-${GITHUB_SHA::12}"
          .github/ocm/verify-fips.sh cosign
          ./cosign version
      # Only maintenance branches save: renovate/** caches are branch-scoped and die with the branch.
      - if: success() && startsWith(github.ref, 'refs/heads/ocm/') && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
