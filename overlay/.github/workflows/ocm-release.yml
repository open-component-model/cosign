# Managed by ocm-main (overlay/). Edits on maintenance branches are overwritten by Sync upstream.
name: OCM Release

# Dispatched daily by Release schedule on ocm-main (schedule triggers only fire on the default branch) or manually: gh workflow run ocm-release.yml --ref ocm/vX.Y.Z
on:
  workflow_dispatch: {}

# Serialize releases per branch: a queued second dispatch finds no diff to the release the first one created and skips.
concurrency:
  group: ocm-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions: {}

env:
  IMAGE: ghcr.io/open-component-model/cosign

# version -> ci (tests + all binaries, built once) -> image -> release. A branch whose tree equals its last release skips everything after version.
jobs:
  version:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      base: ${{ steps.v.outputs.base }}
      version: ${{ steps.v.outputs.version }}
      image-tag: ${{ steps.v.outputs.image-tag }}
      skip: ${{ steps.v.outputs.skip }}
      latest: ${{ steps.v.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - id: v
        name: Compute release version
        run: |
          set -euo pipefail
          BASE="${GITHUB_REF_NAME#ocm/}"
          if ! [[ "$BASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::unexpected branch ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"

          # N continues across the earlier -ocm.N git tags: images are tagged vX.Y.Z-ocm.N
          # in both schemes, so reusing an N would overwrite an existing image tag.
          last="$(git tag --list "${BASE}+ocm.*" "${BASE}-ocm.*" | sed -E "s/^${BASE}[+-]ocm\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)"

          # Release only if the tree differs from the last release (new commits that change
          # nothing, e.g. a revert pair, do not count).
          if [ -n "$last" ]; then
            last_tag="$(git tag --list "${BASE}+ocm.${last}" "${BASE}-ocm.${last}" | head -1)"
            if git diff --quiet "$last_tag" HEAD; then
              echo "No changes since ${last_tag}; nothing to release." | tee -a "$GITHUB_STEP_SUMMARY"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Changes since ${last_tag}:"
            git diff --stat "$last_tag" HEAD
          fi

          # vX.Y.Z+ocm.N: semver build metadata, i.e. a build of upstream vX.Y.Z.
          VERSION="${BASE}+ocm.$(( ${last:-0} + 1 ))"
          # OCI tags cannot contain '+'; images use vX.Y.Z-ocm.N instead.
          IMAGE_TAG="${VERSION/+/-}"

          highest="$(git ls-remote --heads origin 'refs/heads/ocm/v*' | sed 's#.*refs/heads/ocm/##' | sort -V | tail -1)"
          if [ "$BASE" = "$highest" ]; then LATEST=true; else LATEST=false; fi

          {
            echo "skip=false"
            echo "version=${VERSION}"
            echo "image-tag=${IMAGE_TAG}"
            echo "latest=${LATEST}"
          } >> "$GITHUB_OUTPUT"
          echo "version=${VERSION} image-tag=${IMAGE_TAG} latest=${LATEST}"

  ci:
    needs: [version]
    if: needs.version.outputs.skip != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ocm-ci.yml
    with:
      version: ${{ needs.version.outputs.version }}

  image:
    needs: [ci, version]
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      BASE: ${{ needs.version.outputs.base }}
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE_TAG: ${{ needs.version.outputs.image-tag }}
      LATEST: ${{ needs.version.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: binaries
          path: dist
      - run: chmod +x dist/cosign-*
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Smoke-test image
        run: |
          # Native platform of this arm64 runner.
          docker buildx build --platform linux/arm64 --load -t cosign-smoke -f .github/ocm/Containerfile dist
          .github/ocm/smoke-image.sh cosign-smoke "$VERSION"
      - id: push
        name: Build and push multi-arch image
        run: |
          set -euo pipefail
          # vX.Y.Z-ocm.N is immutable; vX.Y.Z moves to the newest build of upstream vX.Y.Z.
          tags=(-t "${IMAGE}:${IMAGE_TAG}" -t "${IMAGE}:${BASE}")
          if [ "$LATEST" = true ]; then tags+=(-t "${IMAGE}:latest"); fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false --sbom=false \
            --push --metadata-file meta.json \
            -f .github/ocm/Containerfile \
            "${tags[@]}" \
            --label org.opencontainers.image.source=https://github.com/open-component-model/cosign \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            dist
          echo "digest=$(jq -r '."containerimage.digest"' meta.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    needs: [ci, version, image]
    runs-on: ubuntu-slim
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      BASE: ${{ needs.version.outputs.base }}
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE_TAG: ${{ needs.version.outputs.image-tag }}
      LATEST: ${{ needs.version.outputs.latest }}
      DIGEST: ${{ needs.image.outputs.digest }}
      FIPS_MODULE: ${{ needs.ci.outputs.fips-module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Load .github/ocm/.env
        run: echo "GIT_CLIFF_VERSION=$(grep -E '^GIT_CLIFF_VERSION=' .github/ocm/.env | cut -d= -f2-)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: binaries
          path: dist
      - name: Checksums
        run: |
          chmod +x dist/cosign-*
          (cd dist && sha256sum cosign-* > cosign_checksums.txt)
          cat dist/cosign_checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/cosign-*
      # Changelog of everything on this branch since the upstream fork point, not
      # since the previous OCM build (see .github/ocm/cliff.toml).
      - uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: ${{ env.GIT_CLIFF_VERSION }}
          config: .github/ocm/cliff.toml
          args: --tag ${{ env.VERSION }} ${{ env.BASE }}..HEAD
        env:
          OUTPUT: changelog.md
      - name: Release notes
        run: |
          set -euo pipefail
          {
            cat changelog.md
            echo
            echo "---"
            echo
            echo "FIPS 140-3 build of upstream [${BASE}](https://github.com/sigstore/cosign/releases/tag/${BASE}) with the CMVP-certified Go Cryptographic Module ${FIPS_MODULE} (GOFIPS140=certified, CGO disabled)."
            echo
            echo "Image: \`${IMAGE}:${IMAGE_TAG}@${DIGEST}\`"
          } > notes.md
          cat notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$LATEST" = true ]; then latest=--latest; else latest=--latest=false; fi
          gh release create "$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file notes.md \
            "$latest"
